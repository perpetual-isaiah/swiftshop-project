services:
  mongodb:
    image: mongo:latest
    container_name: swiftshop-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - swiftshop-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: swiftshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swiftshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swiftshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql-order:
    image: mysql:8.0
    container_name: swiftshop-mysql-order
    environment:
      MYSQL_DATABASE: swiftshop_orders
      MYSQL_USER: swiftshop
      MYSQL_PASSWORD: swiftshop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_order_data:/var/lib/mysql
    networks:
      - swiftshop-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./user-service
    container_name: swiftshop-user-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/swiftshop
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - swiftshop-network
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
    container_name: swiftshop-product-service
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/swiftshop
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiftshop-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    container_name: swiftshop-order-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-order:3306/swiftshop_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: swiftshop
      SPRING_DATASOURCE_PASSWORD: swiftshop
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect

      # Stripe (add webhook secret so Spring doesn't crash)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: whsec_7c48269aba1bf3f25e7db9a9ff88fb020e44b2a81f72dc2da676833d1953fad5

      # Optional (used by app.frontendUrl in application.properties)
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mysql-order:
        condition: service_healthy
    networks:
      - swiftshop-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: swiftshop-api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:5001
      ORDER_SERVICE_URL: http://order-service:8082
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - swiftshop-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: swiftshop-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - api-gateway
    networks:
      - swiftshop-network
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  swiftshop-network:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
  mysql_order_data:
